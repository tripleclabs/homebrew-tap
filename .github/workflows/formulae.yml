name: Homebrew formulae
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/render-formulae.py --manifest release-manifest.json --check
      - run: python3 tests/test-render.py
      - run: brew update
      - run: brew tap --custom-remote tripleclabs/tap "$GITHUB_WORKSPACE"
      - name: Validate every generated formula
        shell: bash
        run: |
          set -euo pipefail
          for path in Formula/*.rb; do
            formula="tripleclabs/tap/$(basename "$path" .rb)"
            brew style "$formula"
            brew install "$formula"
            brew audit "$formula"
            brew test "$formula"
            brew uninstall "$formula"
          done
      - run: brew install tripleclabs/tap/hybrid-bridge
      - run: bash tests/bridge-service.sh
